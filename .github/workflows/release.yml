name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Verify tag matches crate version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/contribai-rs/Cargo.toml | head -1)
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
      - name: Test tagged source
        run: cargo test --workspace --locked
      - name: Check installer contract
        run: node scripts/check-installers.mjs
      - name: Build locked release
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Smoke-test exact release binary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          binary="target/${RELEASE_TARGET}/release/contribai"
          if [ "$RUNNER_OS" = Windows ]; then binary="${binary}.exe"; fi
          test "$("$binary" --version)" = "contribai ${RELEASE_TAG#v}"
          "$binary" demo --json > demo.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("demo.json","utf8"));if(r.external_writes_enabled||r.submission!=="not_attempted"||!r.candidate.evidence_valid||r.protected_path_probe.admission_allowed)process.exit(1)'
      - name: Prepare asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/contribai" "contribai-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          shasum -a 256 "contribai-${GITHUB_REF_NAME}-${{ matrix.asset }}" > "contribai-${GITHUB_REF_NAME}-${{ matrix.asset }}.sha256"
      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "contribai-$env:GITHUB_REF_NAME-${{ matrix.asset }}"
          Copy-Item "target/${{ matrix.target }}/release/contribai.exe" $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii
      - name: Stage verified assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
          path: |
            contribai-${{ github.ref_name }}-${{ matrix.asset }}
            contribai-${{ github.ref_name }}-${{ matrix.asset }}.sha256

  release:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          node -e 'const releases=JSON.parse(require("fs").readFileSync("releases.json","utf8")).flat();if(releases.some(r=>r.tag_name===process.env.RELEASE_TAG&&!r.draft)){console.error("Release is already public; use a new version instead of replacing assets.");process.exit(1)}'
      - name: Download all staged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Verify complete asset set and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-assets.mjs assets "$RELEASE_TAG"
      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: assets/contribai-*
      - name: Stage GitHub draft release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/contribai-*
      - name: Publish uploaded release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and exercise release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CONTRIBAI_VERSION: ${{ github.ref_name }}
          CONTRIBAI_INSTALL_DIR: ${{ runner.temp }}/contribai-bin
        run: |
          bash ./install.sh
          test "$("$CONTRIBAI_INSTALL_DIR/contribai" --version)" = "contribai ${RELEASE_TAG#v}"
          "$CONTRIBAI_INSTALL_DIR/contribai" demo --json > "$RUNNER_TEMP/contribai-demo.json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.external_writes_enabled||r.submission!=="not_attempted"||!r.candidate.evidence_valid||r.protected_path_probe.admission_allowed)process.exit(1)' "$RUNNER_TEMP/contribai-demo.json"
      - name: Install and exercise release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CONTRIBAI_VERSION: ${{ github.ref_name }}
          CONTRIBAI_INSTALL_DIR: ${{ runner.temp }}\contribai-bin
          CONTRIBAI_NO_PATH_UPDATE: "1"
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          & .\install.ps1
          $binary = Join-Path $env:CONTRIBAI_INSTALL_DIR "contribai.exe"
          $installedVersion = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne "contribai $($env:RELEASE_TAG.Substring(1))") {
              throw "Installed binary does not match the release tag"
          }
          $receipt = Join-Path $env:RUNNER_TEMP "contribai-demo.json"
          & $binary demo --json | Set-Content -LiteralPath $receipt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Installed safety demo exited unsuccessfully" }
          $report = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($report.external_writes_enabled -or $report.submission -ne "not_attempted" -or -not $report.candidate.evidence_valid -or $report.protected_path_probe.admission_allowed) {
              throw "Installed release failed the offline safety demo"
          }
