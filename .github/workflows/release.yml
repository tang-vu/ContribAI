name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Verify tag matches crate version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/contribai-rs/Cargo.toml | head -1)
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
      - name: Build locked release
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Prepare asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/contribai" "contribai-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          shasum -a 256 "contribai-${GITHUB_REF_NAME}-${{ matrix.asset }}" > "contribai-${GITHUB_REF_NAME}-${{ matrix.asset }}.sha256"
      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "contribai-$env:GITHUB_REF_NAME-${{ matrix.asset }}"
          Copy-Item "target/${{ matrix.target }}/release/contribai.exe" $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii
      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: contribai-${{ github.ref_name }}-${{ matrix.asset }}
      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            contribai-${{ github.ref_name }}-${{ matrix.asset }}
            contribai-${{ github.ref_name }}-${{ matrix.asset }}.sha256
